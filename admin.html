<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>إدارة المنيو | البرديسي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#1A1310;--card:#2E2318;--line:#4a3a29;--gold:#C9A227;--txt:#f3ead9;--mut:#b8a88f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:'Cairo',sans-serif;line-height:1.7}
main{max-width:860px;margin:0 auto;padding:24px 16px 120px}
h1{font-size:1.5rem;margin:0}
h2{font-size:1.1rem;margin:32px 0 12px;color:var(--gold)}
header{display:flex;justify-content:space-between;align-items:center;gap:12px}
input,textarea,select{width:100%;font:inherit;color:var(--txt);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 12px}
input:focus,textarea:focus,select:focus,button:focus-visible,.upl:focus-within{outline:2px solid var(--gold);outline-offset:1px}
textarea{min-height:64px;resize:vertical}
button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:9px 18px;background:var(--gold);color:#1A1310;font-weight:800}
button.ghost{background:transparent;color:var(--mut);border:1px solid var(--line);font-weight:600;white-space:nowrap}
button:disabled{opacity:.45;cursor:not-allowed}
.box{max-width:420px;margin:12vh auto 0;background:var(--card);padding:28px;border-radius:14px}
.box form{display:grid;gap:12px}
.box p{color:var(--mut);margin:0 0 8px}
.row{display:flex;gap:8px;margin-bottom:8px}
.item{display:grid;grid-template-columns:150px 1fr;gap:16px;background:var(--card);padding:16px;border-radius:12px;margin-bottom:14px}
.f{display:grid;gap:8px}
.pic{display:grid;gap:8px;align-content:start}
.pic img,.pic span{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;background:var(--bg);display:grid;place-items:center;color:var(--mut);font-size:.85rem}
.upl{text-align:center;padding:7px;border:1px dashed var(--gold);border-radius:8px;color:var(--gold);cursor:pointer;font-size:.9rem}
.bar{position:fixed;inset:auto 0 0 0;background:var(--card);border-top:1px solid var(--line);padding:12px 16px;display:flex;gap:12px;align-items:center;justify-content:center}
#msg{margin:12px 0;padding:10px 14px;border-radius:8px}
#msg.ok{background:#1f3a22;color:#bfe8c4}#msg.bad{background:#4a1f1f;color:#ffc9c9}
.err{color:#ffc9c9}.empty{color:var(--mut)}
.help{font-size:.9rem;color:var(--mut);line-height:1.9}
@media(max-width:600px){.item{grid-template-columns:1fr}.pic{grid-template-columns:100px 1fr;align-items:center}.row{flex-wrap:wrap}}
</style>
</head>
<body>
<main>
  <section id="loginBox" class="box" hidden>
    <h1>إدارة المنيو</h1>
    <p>اكتب كلمة السر عشان تدخل.</p>
    <form id="loginForm">
      <input id="pw" type="password" placeholder="كلمة السر" autocomplete="current-password" required>
      <p id="loginErr" class="err" hidden>كلمة السر غلط.</p>
      <button type="submit">دخول</button>
    </form>
  </section>

  <section id="tokenBox" class="box" hidden>
    <h1>ربط الموقع بـ GitHub</h1>
    <p class="help">ده بيتعمل مرة واحدة على الجهاز ده. ادخل GitHub، Settings، Developer settings، Fine-grained tokens. اختار الريبو بتاع الموقع بس، وصلاحية Contents: Read and write. انسخ التوكن وحطه هنا.</p>
    <form id="tokenForm">
      <input id="tk" type="password" placeholder="github_pat_..." required>
      <button type="submit">حفظ التوكن</button>
    </form>
  </section>

  <section id="panel" hidden>
    <header><h1>إدارة المنيو</h1><button class="ghost" id="logout">خروج</button></header>
    <div id="msg" hidden></div>
    <h2>الأقسام</h2>
    <div id="cats"></div>
    <button class="ghost" id="addCat">+ إضافة قسم</button>
    <h2>الأطباق</h2>
    <button class="ghost" id="addItem" style="margin-bottom:14px">+ إضافة طبق</button>
    <div id="items"></div>
    <div class="bar"><button id="saveBtn" disabled>حفظ ونشر</button></div>
  </section>
</main>
<script src="js/admin.js"></script>
</body>
</html>
